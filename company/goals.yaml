# The goal ladder. Example dates and targets: set your own.
# The Goals screen works backwards from the current rung to daily activity (SPEC 3).

north_star: monthly revenue from clients who would recommend us

ladder:
  - id: rung-1
    target_usd: 1000
    by: 2026-12-12
    source: services
  - id: rung-2
    target_usd: 4000          # the middle of $3,000 to $5,000
    by: 2027-02-12
    source: services+pilot
  - id: rung-3
    target_usd: 25000
    by: null                  # set once a pilot has met its target
    source: product

current_rung: rung-1

# Planning guesses until two weeks of real pipeline data exist.
# The OS then replaces these with your own rates.
planning_rates:
  average_first_build_usd: null     # TODO
  concept_to_build: null            # TODO, between 0 and 1
  reply_to_concept: null            # TODO
  reply_rate: null                  # TODO

# Keys must match company/departments.yaml. The Goals screen reads each metric from the tables; the targets are example
# numbers, set your own. Metrics it can measure: qualified_leads_per_week (verified, scored 70 or more, added in the last
# 7 days), positive_replies_per_week (people whose reply was marked positive), stage_exits_per_week and
# stage_exits_per_month (deals that left the funnel stage named in `stage`, written funnel/stage), and monthly_revenue_usd
# (the value of deals won this month, used by the ladder). Any other name is shown as not measured.
department_goals:
  lead-gen:  { metric: qualified_leads_per_week,  target: 20, serves: rung-1 }
  outreach:  { metric: positive_replies_per_week, target: 3,  serves: rung-1 }
  engineering: { metric: stage_exits_per_week, stage: services/free-concept, target: 2, serves: rung-1 }  # concepts delivered
  product:   { metric: stage_exits_per_month, stage: product/slice-session, target: 3, serves: rung-2 }  # slice sessions held
