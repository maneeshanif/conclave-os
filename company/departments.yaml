# Department keys used across the company folder, goals.yaml and the database.
# Rooms 9 and 10 are configured now and switched on later (SPEC 4).
# Rooms 12 to 18 were added in v5 and room 19 in v6 and are switched off until their slice (SPEC 4).
# `division` is the talent catalog division a hire for this department is searched in (SPEC 9).
# The Boardroom is a room, not a department, so it is not listed here.

departments:
  - { key: chief-of-staff,  name: Chief of Staff,        room: 0,  active: true }
  - { key: lead-gen,        name: Lead Gen,              room: 1,  active: true }
  - { key: outreach,        name: Outreach,              room: 2,  active: true }
  - { key: marketing,       name: Marketing and Content, room: 3,  active: false }
  - { key: product,         name: Product (Vespera),     room: 4,  active: false }
  - { key: engineering,     name: Engineering,           room: 5,  active: false }
  - { key: micro-saas-lab,  name: Micro-SaaS Lab,        room: 6,  active: false }
  - { key: founder-network, name: Founder Network,       room: 7,  active: false }
  - { key: calls-desk,      name: Calls Desk,            room: 8,  active: false }
  - { key: demand-radar,    name: Demand Radar,          room: 9,  active: false }
  - { key: research,        name: Research,              room: 10, active: true }
  - { key: talent,          name: Talent,                room: 12, active: false, division: specialized }
  - { key: design-studio,   name: Design Studio,         room: 13, active: false, division: design }
  - { key: qa,              name: QA and Testing,        room: 14, active: false, division: testing }
  - { key: client-success,  name: Client Success,        room: 15, active: false, division: support }
